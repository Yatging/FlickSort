<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlickSort 管理后台</title><link rel="stylesheet" href="../experiment/style.css"></head><body><header><a href="../">主页</a><b>FlickSort · 管理员</b><button id="logout" hidden>退出登录</button></header><main><div id="login"><h1>管理员登录</h1><p>仅限已获得研究数据权限的管理员。参与者无需账户。</p><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></div><div id="dashboard" hidden><h1>累计实验数据</h1><p id="totals"></p><label>匿名 Session ID<input id="participant"></label><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label>模式<select id="mode"><option value="real">真实实验</option><option value="test">Test</option><option value="demo">Demo</option><option value="">全部</option></select></label><label>条件<select id="condition"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>Block<select id="block"><option value="">全部</option><option>1</option><option>2</option></select></label><button id="refresh">刷新 / 筛选</button><button data-export="trials">导出 Trials</button><button data-export="events">导出 Events</button><button data-export="questionnaires">导出问卷</button><label><input id="all" type="checkbox">导出全部模式及全部数据（忽略筛选）</label><p id="distribution"></p><p id="integrity"></p><section id="sessions"></section><h2>数据明细</h2><p>点击 Session 查看当前筛选下的记录。</p><pre id="detail" style="white-space:pre-wrap"></pre></div><p id="status" role="status"></p></main><script src="../experiment/config.js"></script><script type="module" src="app.mjs"></script></body></html>
